# team-layer: Elbo's own CI on GitHub's free runners. Upstream's workflows need paid runners and
# stay queued forever on this fork, so they are disabled in the repo settings (team/UPSTREAM_SYNC.md).
name: Team CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: team-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    if: github.repository == 'MouhssineElBoumshouli/elbo'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      # Team tests commit in temporary repos.
      - name: Git identity for tests
        run: |
          git config --global user.name "Team CI"
          git config --global user.email "team-ci@users.noreply.github.com"

      - name: Setup Vite+
        uses: ./.github/actions/setup-ci-deps

      # knip (inside check:changed) reads the Electron package like upstream's lint job does.
      - name: Cache Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('node_modules/.pnpm/electron@*/node_modules/electron/package.json') }}

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Browser tests beside a changed file run in check:changed.
      - name: Resolve Playwright version
        id: playwright_version
        run: echo "version=$(node -p "require('./apps/web/node_modules/playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright_version.outputs.version }}

      - name: Install Chromium
        if: steps.chromium_cache.outputs.cache-hit != 'true'
        run: node apps/web/node_modules/playwright/cli.js install --with-deps chromium

      - name: Install Chromium system dependencies
        if: steps.chromium_cache.outputs.cache-hit == 'true'
        run: node apps/web/node_modules/playwright/cli.js install-deps chromium

      # Format, lint, knip, typecheck of changed packages and dependents, tests beside the changes.
      - name: Checks for the pushed changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="$BEFORE"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=HEAD~1
          fi
          vp run check:changed "$base"

      - name: Name guard and team release tests
        run: vp test run scripts/team-name-guard.test.ts scripts/team-release.test.ts

      - name: Team tests (server)
        working-directory: apps/server
        run: vp test run src/team/ src/mcp/toolkits/team/ src/cli/team.test.ts

      - name: Team tests (web)
        working-directory: apps/web
        run: vp test run --project unit src/components/team/

      - name: Team tests (client runtime and contracts)
        run: |
          (cd packages/client-runtime && vp test run src/state/team)
          (cd packages/contracts && vp test run src/teamFeed src/teamCards)
