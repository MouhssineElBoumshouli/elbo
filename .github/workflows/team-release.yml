name: Team release

# team-layer: Elbo's Windows installer on this fork's GitHub Releases. Upstream's release.yml only
# runs in pingdotgg/t3code on paid runners; this file reuses its building part, release-desktop.yml,
# unchanged, on GitHub's free runners. How to release: team/RELEASING.md.
#   Beta:   a prerelease, version <nextVersion>-nightly.<date>.<run> (upstream's nightly channel).
#   Stable: rebuilds the newest Beta's commit as <nextVersion>, the release Stable installs follow.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "beta = new prerelease from main; stable = promote the newest Beta"
        required: true
        default: beta
        type: choice
        options:
          - beta
          - stable

concurrency:
  group: team-release
  cancel-in-progress: false

# Every job runs on Ubuntu 24.04 like upstream's: the AppImage step refuses newer glibc, and the
# Linux CLI archive the Windows app embeds for WSL must run on older WSL distros.

permissions:
  # The Windows build reads this run's artifact list to wait for the Linux CLI archive it embeds.
  actions: read
  contents: read

jobs:
  preflight:
    name: Preflight
    if: github.repository == 'MouhssineElBoumshouli/elbo'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      release_channel: ${{ inputs.channel == 'beta' && 'nightly' || 'stable' }}
    steps:
      - name: Checkout release scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          sparse-checkout: .github/scripts

      # Same rules as upstream: dispatched from main, and Stable ships the commit a Beta shipped.
      - id: resolve
        name: Resolve release commit
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          CHANNEL: ${{ inputs.channel }}
        with:
          retries: 3
          script: |
            const {
              assertReleaseSource,
              resolveLatestNightlyCommit,
            } = require('./.github/scripts/check-nightly-release.cjs');
            const stable = process.env.CHANNEL === 'stable';
            await assertReleaseSource({ github, context, releaseChannel: stable ? 'stable' : 'nightly' });
            if (stable) {
              const { tag, sha } = await resolveLatestNightlyCommit({ github, context, core });
              core.notice(`Stable rebuilds ${sha}, the commit Beta ${tag} shipped.`);
              core.setOutput('ref', sha);
            } else {
              core.setOutput('ref', context.sha);
            }

      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.resolve.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - id: meta
        name: Resolve version
        env:
          RUN_STARTED_AT: ${{ github.run_started_at }}
        run: |
          node scripts/team-release.ts meta \
            --channel "${{ inputs.channel }}" \
            --date "$(date -u -d "$RUN_STARTED_AT" +%Y%m%d)" \
            --run-number "${{ github.run_number }}"

      # A Beta after its Stable would sort below it, and a Stable can only ship once.
      - name: Refuse a version that is already out
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          stable="v${VERSION%%-*}"
          if gh release view "$stable" >/dev/null 2>&1; then
            echo "::error::$stable is already released. Bump nextVersion in packages/shared/src/teamIdentity.ts, push, then release a Beta (team/RELEASING.md)."
            exit 1
          fi

  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      - name: Build JS bundle
        run: vp run build:desktop:bundle

      - name: Upload JS bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Not published. The Windows app embeds this job's Linux CLI archive as its WSL runtime, and
  # release-desktop.yml waits for it from a job whose name ends in "Build Linux x64".
  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      # T3 Connect is off in Elbo (no Clerk keys of ours).
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true

  # Built on Linux like upstream, unsigned; installed and started on real Windows by the verify job.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: ${{ needs.preflight.outputs.release_channel }}
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64

  release:
    name: Publish GitHub Release
    needs: [preflight, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/scripts...

      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-win-x64
          path: release-assets

      - name: Download packaged app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verify-win-x64
          path: packaged

      # The update button must read this fork's releases, never T3 Code's.
      - name: Check the app's update feed
        run: |
          set -euo pipefail
          tar -C packaged -xf packaged/unpacked.tar win-unpacked/resources/app-update.yml
          feed=packaged/win-unpacked/resources/app-update.yml
          cat "$feed"
          grep -qx "owner: ${GITHUB_REPOSITORY%/*}" "$feed"
          grep -qx "repo: ${GITHUB_REPOSITORY#*/}" "$feed"

      # x64 only, so the per-arch manifest is the channel's manifest (upstream merges x64 and arm64).
      - name: Name the update manifest
        run: |
          set -euo pipefail
          cd release-assets
          rm -f builder-debug.yml
          for manifest in *-win-x64.yml; do mv "$manifest" "${manifest%-win-x64.yml}.yml"; done
          ls -l

      - name: Write release notes
        run: |
          node scripts/team-release.ts notes \
            --channel "${{ inputs.channel }}" \
            --installer release-assets/*.exe \
            --output release-notes.md

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
          NAME: ${{ needs.preflight.outputs.name }}
          REF: ${{ needs.preflight.outputs.ref }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
        run: |
          set -euo pipefail
          if [[ "$PRERELEASE" == "true" ]]; then
            flags=(--prerelease --latest=false)
          else
            flags=(--latest)
          fi
          # gh uploads every file to a draft and publishes it once all are there.
          gh release create "$TAG" release-assets/*.exe release-assets/*.blockmap release-assets/*.yml \
            --target "$REF" --title "$NAME" --notes-file release-notes.md "${flags[@]}"
